version: '3.8'

services:
  user_service:
    build: ./user_service
    container_name: user_service
    ports:
      - "8001:8001"
    restart: always
    networks:
      - app_network

  user_service_replica:
    build: ./user_service
    container_name: user_service_replica
    restart: always
    networks:
      - app_network

  task_service:
    build: ./task_service
    container_name: task_service
    ports:
      - "8002:8002"
    depends_on:
      - user_service
    restart: always
    networks:
      - app_network

  task_service_replica:
    build: ./task_service
    container_name: task_service_replica
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user_service
      - task_service
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
